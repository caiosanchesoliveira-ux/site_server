<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="chat.css">
</head>
<body>
    <nav class="menu">
        <a class="link" href="index.html">Home</a>
        <a class="link" href="card.html">Cards</a>
        <a class="link" href="chat.html">Chat</a>
        <a class="link" href="cadastro.html">Cadastro</a>
        <a class="link" href="login.html">Login</a>
    </nav>
    
    <div class="container">
        <div class="container-mensagem" id="c_chat">
            <div class="mensagem">Seja bem-vindo(a) ao chat!</div>
        </div>

        <div id="formulario" class="formulario">
            <input id="input" type="text" placeholder="Escreva sua mensagem..." required/>
            <button type="submit" id="btnEnviar">Enviar</button>
        </div>
    </div>

    <footer>&copy; Desenvolvido pelo aluno Caio André - 2026 Curitiba</footer>

    <script>
        let logado = '';

        const input = document.querySelector('#input');
        const btnEnviar = document.querySelector('#btnEnviar');
        const c_chat = document.querySelector('#c_chat');
        const historicoConversa = [];

        function mensagemTela(autor, texto) {
            const textoFinal = document.createElement('p');
            textoFinal.className = 'msg';

            if (autor === logado) {
                textoFinal.classList.add('usuario');
            }

            textoFinal.textContent = `${autor}: ${texto}`;
            c_chat.appendChild(textoFinal);
            c_chat.scrollTop = c_chat.scrollHeight;
        }

        async function iniciarChat() {
            try {
                const resposta = await fetch('/me');

                if (!resposta.ok) {
                    alert('Necessário fazer login para acessar o chat!');
                    return window.location.replace('/login.html');
                }

                const dados = await resposta.json();

                logado = dados.usuario;

                document.querySelector('.mensagem').textContent =
                    `Olá ${logado}, seja bem-vindo!`;

            } catch (erro) {
                console.error('Erro ao verificar login:', erro);
                alert('Não foi possível verificar seu login. Tente novamente.');
                window.location.href = 'login.html';
            }
        }

        btnEnviar.addEventListener('click', async () => {
            const textoMensagem = input.value.trim();

            if (!textoMensagem || !logado) return;

            mensagemTela(logado, textoMensagem);

            historicoConversa.push({
                role: "user",
                content: textoMensagem
            });

            input.value = '';
            btnEnviar.disabled = true;

            try {
                const respostaServidor = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        historico: historicoConversa
                    })
                });

                const dados = await respostaServidor.json();

                if (respostaServidor.status === 401) {
                    window.location.href = 'login.html';
                    return;
                }

                if (respostaServidor.ok) {
                    mensagemTela('Darth Vader', dados.resposta);

                    historicoConversa.push({
                        role: "assistant",
                        content: dados.resposta
                    });

                } else {
                    mensagemTela('Sistema', dados.erro || 'Erro no servidor');
                }

            } catch (erro) {
                mensagemTela('Sistema', 'Erro ao conectar ao servidor');
            } finally {
                btnEnviar.disabled = false;
            }
        });

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                btnEnviar.click();
            }
        });

        iniciarChat();
</script>
</body>
</html>
